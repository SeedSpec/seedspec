protocol_version: "0.3"
id: org.example.chain-provider
name: Chain Provider
version: 0.1.0
kind: feature
definition:
  module: primary-intent
configuration:
  schema: configuration/schema.json
  example: configuration/example.yaml
requires:
  capabilities: []
provides:
  capabilities:
    - id: org.example.chain.ready
      version: 1.0.0
      contract: capabilities/ready.md
compatibility:
  scope: generic
extensions:
  org.example.conformance-marker:
    preserved: true
context:
  modules:
    - id: primary-intent
      format: org.seedspec.intent.markdown
      description: The package author's primary intent.
      entrypoint: feature.md
      source:
        kind: package
        path: definition/feature.md
