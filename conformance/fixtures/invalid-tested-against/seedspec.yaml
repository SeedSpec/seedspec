protocol_version: "0.3"
id: org.example.invalid-tested-against
name: Invalid Tested Against
version: 0.1.0
kind: feature
definition:
  module: primary-intent
configuration:
  schema: configuration/schema.json
  example: configuration/example.yaml
requires:
  capabilities:
    - id: org.example.capability.range
      tested_against: latest
provides:
  capabilities: []
compatibility:
  scope: generic
context:
  modules:
    - id: primary-intent
      format: org.seedspec.intent.markdown
      description: The package author's primary intent.
      entrypoint: feature.md
      source:
        kind: package
        path: definition/feature.md
