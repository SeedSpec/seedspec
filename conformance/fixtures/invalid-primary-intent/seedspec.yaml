protocol_version: "0.3"
id: org.example.invalid-primary-intent
name: Invalid Primary Intent
version: 1.0.0
kind: application
definition:
  module: missing-primary-intent
configuration:
  schema: configuration/schema.json
  example: configuration/example.yaml
provides:
  capabilities: []
context:
  modules:
    - id: primary-intent
      format: org.seedspec.intent.markdown
      description: The package author's primary intent.
      entrypoint: app.md
      source:
        kind: package
        path: definition/app.md
