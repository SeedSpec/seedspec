protocol_version: "0.3"
id: org.example.invalid-verification-method
name: Invalid Verification Method
version: 0.1.0
kind: solution
description: Uses an unregistered and unnamespaced verification method.
definition:
  module: primary-intent
configuration:
  schema: configuration/schema.json
  example: configuration/example.yaml
provides:
  capabilities: []
implementation_profiles:
  - id: invalid-profile
    name: Invalid profile
    description: This condition method must not pass validation.
    prerequisites:
      - id: account-check
        statement: The relevant account supports the required behavior.
        verification:
          method: account-check
          evidence: required
context:
  modules:
    - id: primary-intent
      format: org.seedspec.intent.markdown
      description: The package author's primary intent.
      entrypoint: solution.md
      source:
        kind: package
        path: definition/solution.md
