protocol_version: "0.3"
id: org.example.ambiguous-provider
name: Ambiguous Provider
version: 0.1.0
kind: feature
definition:
  module: primary-intent
configuration:
  schema: configuration/schema.json
  example: configuration/example.yaml
requires:
  capabilities: []
provides:
  capabilities:
    - id: org.seedspec.core.actors
      version: 1.1.0
      contract: capabilities/actors.md
compatibility:
  scope: generic
context:
  modules:
    - id: primary-intent
      format: org.seedspec.intent.markdown
      description: The package author's primary intent.
      entrypoint: feature.md
      source:
        kind: package
        path: definition/feature.md
