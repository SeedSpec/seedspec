protocol_version: "0.3"
id: org.example.decision-feature
name: Decision Feature
version: 0.1.0
kind: feature
definition:
  module: primary-intent
configuration:
  schema: configuration/schema.json
  example: configuration/example.yaml
requires:
  capabilities: []
provides:
  capabilities: []
decisions:
  - id: delivery-mode
    question: Should this feature use local or remote delivery behavior?
    required: true
    options:
      - local
      - remote
compatibility:
  scope: generic
context:
  modules:
    - id: primary-intent
      format: org.seedspec.intent.markdown
      description: The package author's primary intent.
      entrypoint: feature.md
      source:
        kind: package
        path: definition/feature.md
