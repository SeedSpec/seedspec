protocol_version: "0.3"
id: org.seedspec.fixtures.comprehensive-application
name: Comprehensive Application Fixture
version: 0.1.0
kind: application
description: Exercise a complete application package with unified primary intent and supporting context.
metadata:
  license: Apache-2.0
definition:
  module: primary-intent
configuration:
  schema: configuration/schema.json
  example: configuration/example.yaml
  guide: configuration/guide.md
provides:
  capabilities:
    - id: org.seedspec.core.households
      version: 1.0.0
      contract: capabilities/households.md
    - id: org.seedspec.core.actors
      version: 1.0.0
      contract: capabilities/actors.md
    - id: org.seedspec.core.chores
      version: 1.1.0
      contract: capabilities/chores.md
      change_history:
        - from: 1.0.0
          to: 1.1.0
          changes:
            - id: local-terminology
              type: additive
              summary: Consumers may map the lineage term chore to equivalent local product language.
            - id: suggested-reward
              type: additive
              summary: Work descriptions may expose an optional non-negative suggested reward.
      conformance:
        suite: capabilities/conformance/chores.suite.yaml
    - id: org.seedspec.core.assignments
      version: 1.0.0
      contract: capabilities/assignments.md
    - id: org.seedspec.core.approvals
      version: 1.0.0
      contract: capabilities/approvals.md
    - id: org.seedspec.core.balances
      version: 1.0.0
      contract: capabilities/balances.md
    - id: org.seedspec.core.transactions
      version: 1.0.0
      contract: capabilities/transactions.md
components:
  acceptance: acceptance/
  reference: reference/
tasks: tasks.yaml
artifacts:
  - id: chore-reference
    type: org.example.artifact.reference-markdown
    path: reference/capabilities/chores-1.0.0.md
    label: Chore capability reference
    description: Supporting reference material for an earlier chore capability revision.
    media_type: text/markdown
    concerns:
      - org.seedspec.concern.design
extensions:
  org.seedspec.fixtures.catalog:
    audience: families
context:
  modules:
    - id: primary-intent
      format: org.seedspec.intent.markdown
      description: The package author's primary intent.
      entrypoint: allowance-tracker.md
      source:
        kind: package
        path: intent/allowance-tracker.md
