protocol_version: "0.3"
id: org.example.conflicting-feature
name: Conflicting Feature
version: 0.1.0
kind: feature
definition:
  module: primary-intent
configuration:
  schema: configuration/schema.json
  example: configuration/example.yaml
requires:
  capabilities: []
provides:
  capabilities: []
conflicts:
  packages:
    - id: org.seedspec.fixtures.comprehensive-application
      reason: This fixture exists to prove declared package conflicts are retained for implementation review.
compatibility:
  scope: generic
context:
  modules:
    - id: primary-intent
      format: org.seedspec.intent.markdown
      description: The package author's primary intent.
      entrypoint: feature.md
      source:
        kind: package
        path: definition/feature.md
