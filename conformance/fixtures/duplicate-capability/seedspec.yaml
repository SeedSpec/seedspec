protocol_version: "0.3"
id: org.example.duplicate-capability
name: Duplicate Capability
version: 0.1.0
kind: application
definition:
  module: primary-intent
configuration:
  schema: configuration/schema.json
  example: configuration/example.yaml
provides:
  capabilities:
    - id: org.example.capability.same
      version: 1.0.0
      contract: capabilities/one.md
    - id: org.example.capability.same
      version: 2.0.0
      contract: capabilities/two.md
context:
  modules:
    - id: primary-intent
      format: org.seedspec.intent.markdown
      description: The package author's primary intent.
      entrypoint: app.md
      source:
        kind: package
        path: definition/app.md
