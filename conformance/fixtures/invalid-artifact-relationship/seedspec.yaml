protocol_version: "0.3"
id: org.example.invalid-artifact-relationship
name: Invalid Artifact Relationship
version: 1.0.0
kind: application
definition:
  module: primary-intent
configuration:
  schema: configuration/schema.json
  example: configuration/example.yaml
provides:
  capabilities: []
artifacts:
  - id: intent-note
    type: org.example.artifact.intent-note
    path: intent/note.md
relationships:
  - from: intent-note
    type: org.seedspec.relation.derived-from
    to: missing-note
context:
  modules:
    - id: primary-intent
      format: org.seedspec.intent.markdown
      description: The package author's primary intent.
      entrypoint: app.md
      source:
        kind: package
        path: definition/app.md
