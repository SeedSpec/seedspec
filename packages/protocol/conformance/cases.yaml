suite_version: "0.4.2"
protocol_version: "0.4"

cases:
  - id: validate-minimum
    description: A single SPEC.md is a complete package.
    operation: validate
    package: fixtures/minimum
    expect:
      result: pass

  - id: validate-merged-sections
    description: Frontmatter overrides the base manifest and external sections expand.
    operation: validate
    package: fixtures/merged-sections
    expect:
      result: pass

  - id: validate-anchored-capability
    description: Capabilities, criteria, anchors, tasks, and evaluation context resolve together.
    operation: validate
    package: fixtures/anchored-capability
    expect:
      result: pass

  - id: validate-implementation-profile
    description: An implementation profile is a context module with a PROFILE.md entrypoint.
    operation: validate
    package: fixtures/implementation-profile
    expect:
      result: pass

  - id: reject-legacy-package
    description: A package without SPEC.md is not a Protocol 0.4 package.
    operation: validate
    package: fixtures/legacy-package
    expect:
      result: fail
      code: MISSING_SPEC

  - id: reject-unknown-field
    description: Unknown protocol-owned fields are invalid.
    operation: validate
    package: fixtures/unknown-field
    expect:
      result: fail
      code: INVALID_MANIFEST

  - id: reject-duplicate-key
    description: Duplicate YAML keys are invalid in every manifest source.
    operation: validate
    package: fixtures/duplicate-key
    expect:
      result: fail
      code: INVALID_YAML

  - id: reject-unresolved-reference
    description: Structured ID references must resolve.
    operation: validate
    package: fixtures/unresolved-reference
    expect:
      result: fail
      code: INVALID_CROSS_REFERENCE

  - id: reject-unknown-success-anchor
    description: A success anchor must resolve to a declared criterion.
    operation: validate
    package: fixtures/unknown-anchor
    expect:
      result: fail
      code: INVALID_SUCCESS_ANCHOR

  - id: minimum-digest-vector
    description: The minimum package matches the normative package digest algorithm.
    operation: digest
    package: fixtures/minimum
    expect:
      result: pass
      digest: sha256:515bdd046144291104117c3ddca1da9f6b94e30d0f7d57cfd711107ab323830c

  - id: inspect-merged-sections
    description: Inspection reports resolved declarations and authored provenance.
    operation: inspect
    package: fixtures/merged-sections
    expect:
      result: pass
      inspection:
        resolved_manifest:
          id: merged-sections
          name: Resolved name
          kind: workflow
          version: "1.2.0"
          target_protocol: "0.4"
          success:
            criteria:
              - id: complete
                description: The implementation is complete.
          tasks:
            items:
              - id: inspect
                instruction: Inspect the specification.
              - id: implement
                instruction: Implement the specification.
                success_criteria: [complete]
        source_paths:
          - SPEC.md
          - seedspec.yaml
          - tasks/implementation.yaml
        override_paths: ["$.name"]
        section_ids: [tasks:preparation, tasks:implementation]
        success_anchor_ids: [complete]
        unanchored_success_criteria: []
        bundled_packages: []

  - id: inspect-bundled-provenance
    description: Inspection reports unanchored criteria and bundled-child provenance.
    operation: inspect
    package: fixtures/inspect-provenance
    expect:
      result: pass
      inspection:
        resolved_manifest:
          id: inspect-provenance
          name: Inspect provenance
          version: "1.0.0"
          success:
            criteria:
              - id: anchored
                description: The anchored outcome is visible.
              - id: unanchored
                description: The unanchored outcome is visible.
          bundled_packages:
            - id: inspect-child
              version: "2.0.0"
              digest: sha256:4dc5c67e8b09579b7e93ebf90ba86d59a9ce7708488a5625d86b74bda3dfa44a
              path: bundled-packages/child/SPEC.md
              optional: true
        source_paths: [SPEC.md]
        override_paths: []
        section_ids: []
        success_anchor_ids: [anchored]
        unanchored_success_criteria: [unanchored]
        bundled_packages:
          - id: inspect-child
            name: Inspect child
            version: "2.0.0"
            digest: sha256:4dc5c67e8b09579b7e93ebf90ba86d59a9ce7708488a5625d86b74bda3dfa44a
            path: bundled-packages/child/SPEC.md
            optional: true
            capabilities:
              items:
                - id: ready
                  name: Ready
                  description: Reports readiness.
            children: []

  - id: flatten-minimum
    description: Flattened output is a valid standalone package.
    operation: flatten
    package: fixtures/minimum
    expect:
      result: pass
      preserves: [resolved-manifest, markdown-body, source-digest-comment]

  - id: flatten-merged-sections
    description: Flattened merged sections remain a valid standalone package.
    operation: flatten
    package: fixtures/merged-sections
    expect:
      result: pass
      preserves: [resolved-manifest, markdown-body, source-digest-comment]
