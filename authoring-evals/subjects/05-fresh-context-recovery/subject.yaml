authoring_eval_subject_version: "2"
id: 05-fresh-context-recovery
corpus_role: fresh-context-recovery
description: >-
  A workflow requires three author decisions before a forced fresh third agent
  turn, then must converge on one coherent final package without reopening them.
mode: deep
starter:
  package: package
  sources:
    - id: approved-workflow-brief
      path: sources/workflow-brief.md
      authority: approved-incident-operations-owner
    - id: approved-decision-constraints
      path: sources/decision-constraints.md
      authority: approved-platform-owner
author_prompt: >-
  Before proposing edits, ask for the delivery schedule, authoritative incident
  source, and retry identity. After I answer, preserve those decisions across
  later turns. Converge primary intent, configuration guidance, and acceptance
  on one final package. Do not reopen settled choices or invent extra channels,
  escalation, retention, or implementation technology.
execution:
  fresh_agent_turns:
    - 3
proxy_author:
  decisions:
    - id: choose-delivery-schedule
      match:
        any:
          - delivery schedule
          - what time
          - delivery time
          - business days
      answer: >-
        Deliver on business days at 08:30 in the configured team's local
        timezone.
    - id: choose-authoritative-source
      match:
        any:
          - authoritative source
          - source of truth
          - which system
          - incident tracker
      answer: >-
        The incident tracker is authoritative for open state, severity, owner,
        and next action. Chat may enrich wording but cannot create, close, or
        change an incident.
    - id: choose-retry-identity
      match:
        any:
          - retry identity
          - retry behavior
          - duplicate briefing
          - idempotency
      answer: >-
        Use the configured team plus its local calendar date as the idempotency
        key. A retry may replace an undelivered draft, but it must never deliver
        a second briefing for that key.
reference:
  meaning:
    - id: one-daily-briefing
      description: The workflow produces one dependable morning briefing per team.
      source:
        path: sources/workflow-brief.md
      authority: approved-incident-operations-owner
      materiality: critical
      expectation: preserve
    - id: explicit-author-decisions
      description: Schedule, source authority, and retry identity require author answers.
      source:
        path: sources/workflow-brief.md
      authority: approved-incident-operations-owner
      materiality: critical
      expectation: resolve
    - id: recovered-convergence
      description: A fresh agent turn must retain settled answers and finish one coherent package.
      source:
        path: sources/workflow-brief.md
      authority: approved-incident-operations-owner
      materiality: critical
      expectation: preserve
    - id: source-authority-boundary
      description: Chat can enrich wording but cannot become authoritative incident state.
      source:
        path: sources/decision-constraints.md
      authority: approved-platform-owner
      materiality: material
      expectation: preserve
  decisions:
    - id: delivery-schedule
      description: Select the morning delivery schedule before the fresh turn.
      materiality: material
      expected_latitude: fixed
      acceptable_outcomes:
        - Business days at 08:30 in the configured team's local timezone.
    - id: authoritative-incident-source
      description: Select the authoritative incident-state source before the fresh turn.
      materiality: critical
      expected_latitude: fixed
      acceptable_outcomes:
        - The incident tracker is authoritative and chat only enriches wording.
    - id: retry-idempotency-key
      description: Select retry identity and duplicate-delivery behavior before the fresh turn.
      materiality: critical
      expected_latitude: fixed
      acceptable_outcomes:
        - Team plus local calendar date is the idempotency key, with no second delivery.
  obligations:
    - id: prepare-open-incidents
      kind: outcome
      description: Each briefing covers incidents open when it is prepared.
      importance: material
    - id: use-authoritative-tracker
      kind: invariant
      description: Tracker state controls open status, severity, owner, and next action.
      importance: critical
    - id: deliver-business-mornings
      kind: behavior
      description: Deliver at 08:30 on business days in the configured team timezone.
      importance: material
    - id: prevent-second-delivery
      kind: forbidden-state
      description: No team and local date receives a second delivered briefing.
      importance: critical
    - id: retain-decisions-after-fresh-turn
      kind: invariant
      description: Settled author decisions remain controlling after context recovery.
      importance: critical
  permitted_variability:
    - id: briefing-layout
      description: Incident entries may use a table, list, or equivalent compact layout.
      bounds: Every entry still shows severity, owner, and next action.
    - id: draft-replacement-mechanism
      description: Implementations may replace undelivered drafts by any safe mechanism.
      bounds: A retry cannot deliver twice for one team and local date.
  forbidden_inventions:
    - id: extra-delivery-channel
      description: Adding email, paging, chat delivery, or another unapproved channel.
      severity: major
    - id: automatic-escalation
      description: Adding escalation or incident mutation behavior.
      severity: critical
    - id: reopened-settled-decisions
      description: Reopening or replacing the three accepted decisions after the fresh turn.
      severity: critical
    - id: implementation-prescription
      description: Choosing a scheduler, database, framework, or hosting provider.
      severity: major
  protected_paths: []
expectations:
  documents:
    - path: definition/workflow.md
      contains:
        - 08:30
        - incident tracker
        - local calendar date
      contains_any:
        - - business days
          - business day
        - - chat may enrich
          - chat can enrich
      excludes:
        - awaiting author decisions
    - path: configuration/guide.md
      contains:
        - 08:30
        - incident tracker
      contains_any:
        - - team plus its local calendar date
          - team and local calendar date
          - team plus local calendar date
      excludes:
        - awaiting author decisions
    - path: acceptance.md
      contains:
        - second briefing
        - incident tracker
      contains_any:
        - - business days
          - business day
        - - local calendar date
          - local date
  state:
    review_complete: true
    questions:
      open: 0
    candidates:
      open: 0
    proposals:
      required_paths:
        - definition/workflow.md
        - configuration/guide.md
        - acceptance.md
