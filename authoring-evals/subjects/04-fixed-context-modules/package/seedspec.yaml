protocol_version: "0.3"
id: org.seedspec.evals.fixed-context-modules
name: Fixed Context Modules Evaluation
version: 0.1.0
kind: solution
description: Review refund-agent traces without changing independently maintained context modules.
definition:
  module: primary-intent
configuration:
  schema: configuration/schema.json
  example: configuration/example.yaml
provides:
  capabilities: []
components:
  acceptance: acceptance.md
context:
  modules:
    - id: primary-intent
      format: org.seedspec.intent.markdown
      description: The package author's editable primary intent.
      entrypoint: solution.md
      source:
        kind: package
        path: definition/solution.md
    - id: refund-safety
      format: org.example.context.behavior
      format_version: 1.0.0
      description: Independently maintained refund review behavior.
      entrypoint: BEHAVIOR.md
      source:
        kind: package
        path: context/refund-safety/
      applies_to:
        purposes:
          - review
          - evaluate
        audiences:
          - reviewer
          - evaluator
      bridges:
        - skill: review-behavior
          applies_to:
            purposes:
              - review
              - evaluate
            audiences:
              - reviewer
              - evaluator
          description: Use the bridge only when a native behavior adapter is unavailable.
    - id: review-behavior
      format: io.agentskills.skill
      description: Independently maintained instructions for consuming the behavior module.
      entrypoint: SKILL.md
      source:
        kind: package
        path: context/review-behavior/
      applies_to:
        purposes:
          - review
          - evaluate
        audiences:
          - reviewer
          - evaluator
