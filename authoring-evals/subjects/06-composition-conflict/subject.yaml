authoring_eval_subject_version: "2"
id: 06-composition-conflict
corpus_role: composition-conflict
description: >-
  Three plausible capability-provider profiles encounter approved room-only and
  immutable-email controls that cannot both hold without an explicit exception.
mode: deep
starter:
  package: package
  sources:
    - id: approved-operations-control
      path: sources/operations-control.md
      authority: approved-incident-operations-owner
    - id: approved-records-control
      path: sources/records-control.md
      authority: approved-records-owner
    - id: approved-provider-options
      path: sources/provider-options.md
      authority: approved-provider-catalog
author_prompt: >-
  Review the three provider profiles against both approved controls. Do not
  infer precedence and do not silently select a provider. Surface the conflict
  in primary intent and acceptance. Ask who resolves it. If no authority can
  decide now, add a required package decision named delivery-control-resolution
  for the compliance steering group. Preserve the existing profile guidance.
execution:
  fresh_agent_turns: []
proxy_author:
  decisions:
    - id: resolve-control-precedence
      match:
        any:
          - which control takes precedence
          - who resolves
          - compliance steering group
          - select a provider
          - provider should
      answer: >-
        Neither owner has precedence and I cannot approve an exception. Do not
        select a provider. Record delivery-control-resolution as a required
        package decision for the compliance steering group. The decision must
        choose which control governs or approve a provider-specific exception.
    - id: confirm-profile-preservation
      match:
        any:
          - edit the profile
          - change the provider guidance
          - rewrite the profiles
      answer: >-
        Preserve all three profile guidance files. They accurately describe the
        candidates and their current control gaps.
reference:
  meaning:
    - id: room-only-control
      description: Incident notices must appear only in the authenticated room with no email copy.
      source:
        path: sources/operations-control.md
      authority: approved-incident-operations-owner
      materiality: critical
      expectation: preserve
    - id: immutable-email-control
      description: Every incident notice must have an immutable email archive and receipt.
      source:
        path: sources/records-control.md
      authority: approved-records-owner
      materiality: critical
      expectation: preserve
    - id: unresolved-authority-conflict
      description: No source gives either control precedence or authorizes an exception.
      source:
        path: sources/provider-options.md
      authority: approved-provider-catalog
      materiality: critical
      expectation: delegate
    - id: candidate-not-selection
      description: The three provider entries are plausible candidates, not an approved selection.
      source:
        path: sources/provider-options.md
      authority: approved-provider-catalog
      materiality: material
      expectation: preserve
  decisions:
    - id: delivery-control-resolution
      description: Decide which approved control governs or approve a specific exception.
      materiality: critical
      expected_latitude: delegated
      acceptable_outcomes:
        - A required package decision delegates resolution to the compliance steering group.
        - No provider is selected until the compliance steering group records a decision.
    - id: provider-selection
      description: Select a capability provider only after the control conflict is resolved.
      materiality: critical
      expected_latitude: unresolved
      acceptable_outcomes:
        - Provider selection remains unresolved and all three candidates stay visible.
  obligations:
    - id: surface-both-controls
      kind: invariant
      description: Primary intent and acceptance name both approved controls and their contradiction.
      importance: critical
    - id: prohibit-silent-provider-choice
      kind: forbidden-state
      description: No provider candidate is silently preferred or selected.
      importance: critical
    - id: delegate-authority
      kind: boundary
      description: The compliance steering group owns the required control-resolution decision.
      importance: critical
    - id: preserve-provider-candidates
      kind: outcome
      description: All three plausible provider profiles remain available for later review.
      importance: material
  permitted_variability:
    - id: conflict-presentation
      description: The conflict may be shown in prose, a comparison table, or decision rationale.
      bounds: Both controls, all candidates, and delegated authority remain explicit.
    - id: decision-options-wording
      description: The required decision options may use different concise labels.
      bounds: Options must cover governing control or a provider-specific exception.
  forbidden_inventions:
    - id: invented-control-precedence
      description: Claiming either approved owner or control takes precedence.
      severity: critical
    - id: silent-provider-selection
      description: Selecting or preferring a provider before the delegated decision.
      severity: critical
    - id: invented-compliant-provider
      description: Claiming a listed candidate satisfies both controls without an exception.
      severity: critical
    - id: new-delivery-provider
      description: Adding a provider outside the approved catalog.
      severity: major
  protected_paths:
    - path: implementation/incident-room-relay.md
      kind: supporting-material
    - path: implementation/immutable-mail-archive.md
      kind: supporting-material
    - path: implementation/dual-delivery-broker.md
      kind: supporting-material
expectations:
  documents:
    - path: definition/integration.md
      contains:
        - authenticated incident room
        - immutable email archive
        - compliance steering group
      contains_any:
        - - no provider is selected
          - do not select a provider
          - provider selection remains unresolved
        - - conflict
          - cannot both
    - path: acceptance.md
      contains:
        - compliance steering group
      contains_any:
        - - authenticated incident room
          - room-only
        - - immutable email archive
          - immutable email copy
        - - no provider is selected
          - provider is not selected
          - provider selection remains unresolved
    - path: seedspec.yaml
      contains:
        - delivery-control-resolution
        - "required: true"
        - compliance steering group
  state:
    review_complete: true
    questions:
      open: 0
    candidates:
      open: 0
    proposals:
      required_paths:
        - definition/integration.md
        - acceptance.md
        - seedspec.yaml
