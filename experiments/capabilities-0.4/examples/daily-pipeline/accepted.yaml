authorship:
  status: accepted
  accepted_by: experiment-controller
  accepted_at: 2026-08-12T03:34:07.394Z
capabilities:
  - id: org.seedspec.fixtures.daily-pipeline-briefing
    version: 0.1.0
    name: Daily pipeline briefing
    description: A configured HubSpot metric is reported for the previous local
      calendar day and delivered once to an authorized Slack channel.
    source_refs:
      - "#4f5a938eb4ba"
      - "#f147bf872b5c"
      - "#8078ec18beb9"
    outcomes:
      - id: required-resources-exist
        description: The metric property, report, dashboard, and schedule exist with the
          configured identity and meaning.
        source_refs:
          - "#751d4bd52064"
          - "#6ca5cfe535ff"
          - "#8078ec18beb9"
        acceptance:
          - id: setup-resources
            description: Inspect setup evidence for the configured property, report,
              dashboard, and schedule.
            verification:
              kind: agent-review
              stability: nondeterministic
              rubric: Pass only when every required resource exists and matches the configured
                identity, ownership, and business meaning.
          - id: setup-idempotency
            description: Repeat setup and confirm that it creates no duplicate resource.
            verification:
              kind: agent-review
              stability: nondeterministic
              rubric: Pass only when an ordinary retry reuses safe matching resources and
                creates no duplicate property, report, dashboard, or schedule.
      - id: previous-local-day-is-queried
        description: Delivery calculates the configured metric for the previous calendar
          day in the configured IANA timezone.
        source_refs:
          - "#def9c43dd941"
          - "#6d994f8d9071"
          - "#613eb442244b"
          - "#8078ec18beb9"
        acceptance:
          - id: reporting-query
            description: Inspect a delivery at a timezone boundary and confirm the exact
              object, property, date, and timezone queried.
            verification:
              kind: agent-review
              stability: nondeterministic
              rubric: Pass only when the query uses the configured object and property for the
                previous local calendar day, including across daylight-saving
                transitions.
      - id: one-complete-message-is-delivered
        description: The authorized Slack channel receives one message with the metric,
          date, value or no-data state, timezone, and an allowed dashboard link
          when available.
        source_refs:
          - "#def9c43dd941"
          - "#4d5365446123"
          - "#8078ec18beb9"
        acceptance:
          - id: value-message
            description: Deliver a known value and inspect the destination and message
              meaning.
            verification:
              kind: agent-review
              stability: nondeterministic
              rubric: Pass only when the authorized channel receives the configured metric,
                previous date, formatted value, timezone, and a stable
                authorized link when available.
          - id: message-idempotency
            description: Retry the same reporting period and confirm that no duplicate
              message is sent.
            verification:
              kind: agent-review
              stability: nondeterministic
              rubric: Pass only when one reporting period produces at most one delivered
                message under ordinary retry.
          - id: unsafe-link
            description: Supply unstable and unauthorized dashboard links and inspect the
              delivered message.
            verification:
              kind: agent-review
              stability: nondeterministic
              rubric: Pass only when unstable or unauthorized links are omitted without
                suppressing the required message.
      - id: missing-data-remains-distinct-from-zero
        description: A day without data follows the selected empty-day behavior and
          never reports a numeric zero as observed data.
        source_refs:
          - "#6d994f8d9071"
          - "#613eb442244b"
          - "#8078ec18beb9"
        acceptance:
          - id: no-data
            description: Deliver a no-data result and inspect the message or
              intentional-skip record.
            verification:
              kind: agent-review
              stability: nondeterministic
              rubric: Pass only when missing data is explicit, the reporting period is
                preserved, and zero is not substituted for absence.
      - id: delivery-failure-is-safe-and-retryable
        description: A delivery failure is visible, excludes credentials and sensitive
          CRM data, and permits a later retry without duplicate delivery.
        source_refs:
          - "#6d994f8d9071"
          - "#0a327041b301"
          - "#8078ec18beb9"
        acceptance:
          - id: visible-retry
            description: Force one delivery failure, inspect its operational evidence, and
              retry.
            verification:
              kind: agent-review
              stability: nondeterministic
              rubric: Pass only when failure evidence is visible and secret-safe and the retry
                produces one successful delivery.
      - id: conflicting-existing-state-stops
        description: A conflicting existing property or ambiguous target stops mutation
          and is surfaced for user direction.
        source_refs:
          - "#6ca5cfe535ff"
          - "#6d994f8d9071"
          - "#8078ec18beb9"
        acceptance:
          - id: conflict-safety
            description: Supply an existing property with incompatible ownership or meaning
              and attempt setup.
            verification:
              kind: agent-review
              stability: nondeterministic
              rubric: Pass only when setup stops without reusing, overwriting, or duplicating
                the conflicting property.
    integration:
      needs:
        - id: hubspot-authority
          description: An explicitly authorized HubSpot account and scope for resource
            inspection and change.
          required: true
        - id: slack-authority
          description: An explicitly authorized Slack workspace and channel for delivery.
          required: true
      offers:
        - id: daily-briefing-evidence
          description: Observable delivery and failure evidence for the configured daily
            briefing.
